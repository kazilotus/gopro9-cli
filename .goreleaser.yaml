version: 2
project_name: gopro9
before:
  hooks:
    - go mod tidy
builds:
  - id: gopro9
    main: ./cmd/gopro9
    binary: gopro9
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/kazilotus/gopro9-cli/internal/buildinfo.Version={{.Version}}
      - -X github.com/kazilotus/gopro9-cli/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/kazilotus/gopro9-cli/internal/buildinfo.Date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]
checksum:
  name_template: checksums.txt
  algorithm: sha256
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args: [sign-blob, --yes, --output-certificate, "${certificate}", --output-signature, "${signature}", "${artifact}"]
    artifacts: checksum
nfpms:
  - id: packages
    package_name: gopro9
    vendor: kazilotus
    homepage: https://github.com/kazilotus/gopro9-cli
    maintainer: kazilotus <kazilotus@hotmail.com>
    description: Control a GoPro HERO9 Black over USB-C
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^docs:', '^test:', '^chore\(deps\):', '^ci:']
release:
  github:
    owner: kazilotus
    name: gopro9-cli
  draft: false
  prerelease: auto
  footer: |
    ---
    Binaries are signed with cosign (keyless). Verify with:
    `cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig --certificate-identity-regexp 'github.com/kazilotus/gopro9-cli' --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`
